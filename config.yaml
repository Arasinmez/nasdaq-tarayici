# Mesajlardaki saatler için
yerel_saat_dilimi: Europe/Istanbul

# Günlük kayıtlar, sinyal geçmişi ve durum dosyası bu klasöre yazılır
veri_klasoru: veri

telegram:
  aktif: true
  # Güvenlik için token ve chat id'yi buraya yazmak yerine ortam değişkeni
  # olarak ver: TELEGRAM_BOT_TOKEN ve TELEGRAM_CHAT_ID (README'ye bak).
  # Yine de buraya yazmak istersen tırnak içinde yaz ve dosyayı kimseyle paylaşma.
  bot_token: ""
  chat_id: ""

zamanlama:
  gun_ici_aralik_dakika: 10       # piyasa açıkken kaç dakikada bir taransın (bilgisayarda çalışırken)
  bar_dakika: 5                   # gün içi mum uzunluğu (dakika)
  mum_kapanis_gecikmesi_sn: 20    # mum kapandıktan kaç saniye sonra veri çekilsin
  gunluk_tarama_gecikme_dk: 15    # kapanıştan kaç dakika sonra günlük tarama yapılsın
  acilis_bildirimi: true          # piyasa açılınca "bot çalışıyor" mesajı

stratejiler:
  kirilim:                        # 20 günlük zirvenin yüksek hacimle kırılması
    aktif: true
    zirve_gun: 20
    hacim_kati: 1.5               # hacim, 20 günlük ortalamanın en az bu katı
  trend_geri_cekilme:             # yükselen trendde RSI dipten dönerken
    aktif: true
    rsi_esik: 40
  acilis_araligi_kirilimi:        # gün içi: ilk 15 dakikanın tepesinin kırılması
    aktif: true
    aralik_dakika: 15
    hacim_kati: 1.5
    son_saat_et: "11:30"          # New York saatiyle bundan sonra sinyal verme
    taze_dakika: 20               # kırılım bundan daha eskiyse geç kalmış say, mesaj atma

filtreler:
  endeks: QQQ                     # Nasdaq-100 fonu; filtreler buna bakar
  piyasa:                         # endeks 200 günlük ortalamanın altındaysa yeni sinyal yok
    aktif: true
    sma: 200
  goreceli_guc:                   # sadece son 3 ayda endeksten güçlü giden hisseler
    aktif: true
    gun: 63

risk:
  atr_carpani: 2.0                # günlük stop = fiyat − 2 × ATR(14)
  hedef1_r: 1.0                   # TP1 = riskin 1 katı. TP1'de yarısını sat, stop'u girişe çek
  hedef_r: 2.0                    # TP2 = riskin 2 katı. Kalan yarı burada kapanır

takip:
  tekrar_bekleme_saat: 20         # aynı hisse + strateji için en erken tekrar uyarı
  gunluk_sinyal_max_gun: 20       # günlük sinyaller en fazla kaç işlem günü takip edilsin
